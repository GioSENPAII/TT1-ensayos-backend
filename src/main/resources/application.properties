spring.application.name=ensayos-backend

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=1296000000

# JavaMail — Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.mx.ipn.escom.tt=INFO
logging.level.org.springframework.security=INFO
app.mail.enabled=${MAIL_ENABLED:true}

# Carga de ensayos (RN-IA-02: máximo 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.storage.dir=${STORAGE_DIR:./data/ensayos}

# Motor de IA: "simulado" (desarrollo) o "real" (microservicio Python en Cloud Run)
app.ia.modo=${AI_MODE:simulado}
app.ia.base-url=${AI_BASE_URL:}
app.ia.api-key=${AI_API_KEY:}
app.ia.connect-timeout=5s
app.ia.read-timeout=60s
