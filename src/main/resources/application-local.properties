# Perfil "local": MySQL en Docker (docker-compose.yml en la raíz de este repo) en lugar de Cloud SQL.
# Arrancar con: ./run-local.sh
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ensayos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City&characterEncoding=UTF-8
spring.datasource.username=app_user
spring.datasource.password=app_local

# Clave JWT solo para desarrollo local (no usar en producción)
app.jwt.secret=${JWT_SECRET:o7vQMjWXc40YQlmrqOEzYfK0Tf/Z71U7x85sEn2r8a18+Sh2iEgWQbiQ9Zm+5Gmk}

# Gmail: se toman de las variables de entorno MAIL_USERNAME / MAIL_PASSWORD (run-local.sh las lee de env.yaml)
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

logging.level.mx.ipn.escom.tt=DEBUG
